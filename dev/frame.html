<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>frame</title></head>
<body style="margin:0;background:#000">
    <!-- 장면 사진용 — 패널을 정확한 크기의 iframe 에 (머리 없는 브라우저는 처음 창 크기가 달라서) -->
    <iframe id="f" style="border:0;display:block"></iframe>
    <script>
        const q = new URLSearchParams(location.search);
        f.style.width = `${q.get('w')}px`;
        f.style.height = `${q.get('h')}px`;
        f.src = `panel.html?${q.get('q')}`;
    </script>
</body>
</html>
