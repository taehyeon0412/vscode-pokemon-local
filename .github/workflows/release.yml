# 태그 v* 를 올리면 — CI 를 전부 통과한 vsix 를 GitHub 릴리스에 vscode-pokemon-local.vsix 로 올림
# README 의 설치 한 줄(install.sh)이 releases/latest/download/vscode-pokemon-local.vsix 를 받음
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # 쓰기 권한은 이 작업에만 — 의존성 설치 · 빌드는 하지 않고 CI 가 만든 vsix 를 올리기만
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: 태그와 extension/package.json 버전이 같은지
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c "import json; print(json.load(open('extension/package.json', encoding='utf-8'))['version'])")"
          if [ "$want" != "$have" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 extension/package.json 버전 $have 이 달라요"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.vsix vscode-pokemon-local.vsix
          {
            echo "## 설치 / 업데이트"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash"
            echo '```'
            echo
            echo "끝나면 VS Code 명령 팔레트에서 **Developer: Reload Window**. 자세한 건 [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            # 버전별 바뀐 내용이 있으면 덧붙임
            if [ -f ".github/release-notes/${GITHUB_REF_NAME}.md" ]; then
              echo
              cat ".github/release-notes/${GITHUB_REF_NAME}.md"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" vscode-pokemon-local.vsix \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
