# 푸시마다 — 타입 검사 · 코드 규칙 · 자동 테스트 · vsix 묶기 · 실제 VS Code 테스트
# release.yml 도 이 작업을 그대로 불러 쓴 뒤에만 릴리스함 (확인 안 된 vsix 가 나가지 않게)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 설치 스크립트는 돌리지 않음 (의존성 하나가 오염돼도 저장소 · 릴리스에 손대지 못하게)
      - run: npm ci --no-audit --no-fund --ignore-scripts

      - name: 타입 검사 · 코드 규칙 (층 사이 의존 방향 포함)
        run: npm run check

      - name: 자동 테스트 (계산 규칙 · 세이브 · 확장 ↔ 웹뷰)
        run: npm test

      - name: 설치 스크립트 문법
        run: bash -n install.sh

      - name: vsix 묶기 (게임 모드 빌드 포함)
        run: python3 install.py --no-install

      - name: vsix 안에 게임 파일이 있는지 · 개발용 파일이 없는지
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.vsix')[0]).namelist()
          need = ['extension/out/game/host.js', 'extension/media/game/boot.js',
                  'extension/media/game/game.js', 'extension/out/extension/game-loader.js']
          missing = [n for n in need if n not in names]
          extra = [n for n in names if n.endswith('.map') or '.test' in n]
          print('missing:', missing, 'extra:', extra)
          sys.exit(1 if missing or extra else 0)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 7

      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 실제 VS Code 테스트 (최신)
        run: xvfb-run -a npm run test:integration

      - name: 실제 VS Code 테스트 (가장 낮은 지원 버전 1.73)
        run: xvfb-run -a node .test-out/run-integration.cjs
        env:
          VSCODE_TEST_VERSION: 1.73.0
